apiVersion: v1
kind: ConfigMap
metadata: {name: web-config}
data:
  DB_POOL_SIZE: "15"
  DB_HOST: db
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web}
spec:
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      terminationGracePeriodSeconds: 15
      containers:
      - name: web
        image: vaccinations-pr4:local
        imagePullPolicy: Never
        ports: [{name: http, containerPort: 8000}]
        envFrom: [{configMapRef: {name: web-config}}]
        env:
        - name: POD_NAME
          valueFrom: {fieldRef: {fieldPath: metadata.name}}
        - name: DB_PASSWORD
          valueFrom: {secretKeyRef: {name: db-secret, key: password}}
        - {name: DATABASE_URL, value: "postgresql://vaccinations:$(DB_PASSWORD)@$(DB_HOST):5432/vaccinations"}
        resources:
          requests: {cpu: 500m, memory: 64Mi}
          limits: {cpu: "1", memory: 512Mi}
        readinessProbe:
          httpGet: {path: /healthz, port: http}
          timeoutSeconds: 3
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet: {path: /livez, port: http}
        lifecycle:
          preStop: {sleep: {seconds: 5}}
---
apiVersion: v1
kind: Service
metadata: {name: web}
spec:
  type: NodePort
  selector: {app: web}
  ports: [{port: 8000, targetPort: http, nodePort: 30080}]
